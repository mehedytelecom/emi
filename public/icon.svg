<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Central Graphic: Telecom Device + EMI Financial Shield -->
  <g filter="url(#shadow)">
    <!-- Smartphone Chassis -->
    <rect x="146" y="80" width="220" height="352" rx="36" fill="#1e293b" stroke="#334155" stroke-width="6" />
    <!-- Screen -->
    <rect x="162" y="112" width="188" height="288" rx="20" fill="#0f172a" />
    
    <!-- Speaker & Notch -->
    <rect x="226" y="94" width="60" height="6" rx="3" fill="#475569" />
    <circle cx="212" cy="97" r="3" fill="#475569" />

    <!-- Screen Content: EMI Badge and Chart lines -->
    <!-- Taka Symbol ৳ Circle Badge -->
    <circle cx="256" cy="200" r="48" fill="url(#accentGrad)" />
    <!-- Bangladeshi Taka ৳ Symbol -->
    <text x="256" y="217" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">৳</text>

    <!-- Calendar Installment Progress Bars -->
    <rect x="186" y="276" width="140" height="10" rx="5" fill="#334155" />
    <rect x="186" y="276" width="95" height="10" rx="5" fill="url(#accentGrad)" />

    <rect x="186" y="300" width="140" height="10" rx="5" fill="#334155" />
    <rect x="186" y="300" width="120" height="10" rx="5" fill="url(#glowGrad)" />

    <!-- Checkmark Badge on phone -->
    <circle cx="256" cy="348" r="22" fill="#10b981" />
    <path d="M246 348 L253 355 L267 341" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Telecom Signal Wave Overlay at top right -->
  <path d="M370 70 A 50 50 0 0 1 420 120" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M386 86 A 30 30 0 0 1 416 116" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <circle cx="395" cy="125" r="4" fill="#10b981" />
</svg>
